name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21 and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl gnupg
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev
      - name: Bootstrap from the bundled seed
        run: ./bootstrap.sh --seed
        env:
          SOLE_LLVM_LIB: LLVM-21
      - name: Test syntax, compiler, installation, and formatter
        run: make test-suite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .editors/vscode/package-lock.json
      - name: Test editor extension
        run: |
          npm --prefix .editors/vscode ci
          npm --prefix .editors/vscode test
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(.build/sole --version)" = "sole $version (self-hosted)"
          archive="sole-$version-linux-x86_64"
          mkdir -p ".build/$archive/bin" ".build/$archive/share/sole"
          install -m 755 .build/sole ".build/$archive/bin/sole"
          cp -R lib ".build/$archive/share/sole/"
          cp README.md .build/bootstrap-proof.txt ".build/$archive/"
          mkdir -p dist
          tar -C .build -czf "dist/$archive.tar.gz" "$archive"
          (cd dist && sha256sum "$archive.tar.gz" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Sole ${GITHUB_REF_NAME#v}" \
            --notes 'Experimental self-hosted Sole compiler with a built-in formatter. Linux x86-64 only; requires glibc, LLVM 21 (libLLVM.so.21.1), and a native C toolchain. Verify the archive using SHA256SUMS, then extract it and copy bin/ and share/ into your installation prefix. Source archives are available below.'
