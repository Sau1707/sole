name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21 and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl gnupg patchelf
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev
      - name: Bootstrap from the bundled seed
        run: sh scripts/bootstrap-ci.sh
        env:
          SOLE_LLVM_LIB: LLVM-21
      - name: Package compiler with bundled libraries
        run: |
          version=$(.build/sole --version | awk '{print $2}')
          sh scripts/package-release.sh "$version"
          echo "SOLE_TEST_RELEASE=dist/sole-$version-linux-x86_64.tar.gz" >> "$GITHUB_ENV"
      - name: Test syntax, compiler, installation, and formatter
        run: |
          sha256sum -c .build/bootstrap-proof.txt
          make test-suite SOLE_COMPILER="$PWD/.build/sole"
      - name: Test release without system LLVM
        run: |
          docker run --rm -e SOLE_TEST_RELEASE -v "$PWD:/source:ro" ubuntu:24.04 sh -eu -c '
            apt-get update
            apt-get install -y --no-install-recommends build-essential
            mkdir /work
            tar -xzf "/source/$SOLE_TEST_RELEASE" -C /work
            package=/work/$(basename "$SOLE_TEST_RELEASE" .tar.gz)
            "$package/bin/sole" --version
            "$package/bin/sole" syntax /source/compiler/tests/cases/001-compile_without_python_on_path/source/hello.sole
            "$package/bin/sole" build /source/compiler/tests/cases/001-compile_without_python_on_path/source/hello.sole -o /work/hello
            /work/hello
          '
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .editors/vscode/package-lock.json
      - name: Test editor extension
        run: |
          npm --prefix .editors/vscode ci
          npm --prefix .editors/vscode test
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "$(.build/sole --version)" = "sole ${GITHUB_REF_NAME#v} (self-hosted)"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Sole ${GITHUB_REF_NAME#v}" \
            --notes 'Experimental self-hosted Sole compiler with a built-in formatter and EBNF syntax checker (sole syntax). Local development commands use the installed release; source bootstrapping is separate for CI. Linux x86-64 with glibc 2.39 or newer. LLVM and its non-glibc dependencies are bundled. Use install.sh to install the release and any missing native C build tools. For manual installation, verify SHA256SUMS and copy bin/, lib/, and share/ into the same prefix. Third-party notices are in share/sole/licenses/. Source archives are available below.'
